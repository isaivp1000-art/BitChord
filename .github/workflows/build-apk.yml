name: Compilar APK

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: "Tarea de Gradle (déjala así si no sabes)"
        required: true
        default: "assembleDevDebug"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Preparar Android SDK (licencias, plataforma 36 y CMake)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "cmake;3.22.1" || true

      - name: Recuperar la llave de firma
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar
        env:
          TASK: ${{ inputs.gradle_task }}
        run: ./gradlew $TASK --no-daemon --stacktrace

      - name: Reunir los APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \; 2>/dev/null || true
          if [ -z "$(ls -A dist)" ]; then
            find . -path "*/build/outputs/apk/*" -name "*.apk" -exec cp {} dist/ \;
          fi
          if [ -z "$(ls -A dist)" ]; then
            echo "No se generó ningún APK. Revisa el paso Compilar."
            exit 1
          fi
          ls -lh dist

      - name: Guardar una copia como artefacto
        uses: actions/upload-artifact@v6
        with:
          name: apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.gradle_task }}
        run: |
          TAG="apk-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "APK $TAG" \
            --notes "Compilado desde el commit ${GITHUB_SHA::7} con la tarea $TASK. Si hay varios APK, instala el universal; si no hay, el arm64-v8a (sirve para la mayoría de celulares)."
